<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Maze of Life</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    canvas {
      display: block;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      image-rendering: auto;
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      transition: opacity 0.6s ease, transform 0.6s ease;
      background: #0a0a0a;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #shirt-mockup.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    canvas.hidden {
      display: none;
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    /* --- INFO ROW --- */
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    /* --- DESCRIPTION --- */
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    /* ============================================
       RESPONSIVE
    ============================================ */
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>
</head>
<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <!-- TITLE (CENTER TOP) -->
  <div class="title-bar">
    <div class="title"><span class="accent">Maze</span> of Life</div>
  </div>

  <!-- CANVAS CONTAINER -->
  <div id="canvas-container">
    <canvas id="target"></canvas>
    <img id="shirt-mockup" src="Maze-of-Life.jpg" alt="Maze of Life on T-Shirt" />
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <!-- INFO ROW -->
    <div class="info-row">
      <div class="info-item">
        <span class="label">seed</span>
        <span class="value" id="seedDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">grid</span>
        <span class="value" id="gridDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">cells</span>
        <span class="value" id="cellsDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">iterations</span>
        <span class="value" id="iterDisplay">---</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">cellular automata</span>
      <span class="sep">·</span>
      <span class="highlight">100–200 grid</span>
      <span class="sep">·</span>
      <span class="highlight">500–10500 iterations</span>
      <span class="sep">·</span>
      <span class="highlight">random colors</span>
      <span class="sep">·</span>
      <span class="highlight">seed-based</span>
    </div>

  </div>

</div>

<script>
// ============================================
// MAZE OF LIFE — PURE JS (EXACT ORIGINAL ART)
// ============================================

// --- RANDOM GENERATOR ---
class RandomGenerator {
  constructor(seed) {
    this.seed = seed;
    this.state = seed;
  }
  rand() {
    let x = this.state;
    x ^= x << 13;
    x ^= x >> 17;
    x ^= x << 5;
    this.state = x;
    return (x >>> 0) / 4294967296;
  }
}

// --- STATE ---
const ratio = 1 / 1;
const prefix = 'Maze of Life';
const features = {};
let seed = Date.now() + Math.random() * 1000000;
let rng = new RandomGenerator(seed);
let showingShirt = false;
let resizeTmr = null;
let animated = false;
let nextFrame = null;
let thumbnailTaken = false;

// --- URL PARAMS ---
const urlParams = new URLSearchParams(window.location.search);
let forceDownloaded = false;

// --- COLOR ARRAYS (EXACTLY AS ORIGINAL) ---
const backgroundColours = [
  '#000000', '#040720', '#34282C', '#3A3B3C', '#151B54', '#151B8D', '#033E3E',
  '#25383C', '#3C565B', '#1F6357', '#006A4E', '#4B5320', '#254117', '#004225',
  '#665D1E', '#473810', '#3B2F2F', '#8B0000', '#660000', '#3F000F', '#2B1B17',
  '#550A35', '#36013F', '#2E1A47', '#FBBBB9', '#F8B88B', '#FF6347'
];

const ForegroundColours = [
  ['#A0CE31', '#5F31CE'],
  ['#0EDEF1', '#F1210E'],
  ['#0EDEF1', '#930EF1', '#F1210E', '#6CF10E'],
  ['#A33FC0', '#C03F9C', '#633FC0'],
  ['#D53F2A', '#D5942A', '#D52A6B'],
  ['#EEEF10', '#7EEF10', '#EF8110'],
  ['#EA15D0', '#EA1566', '#9915EA'],
  ['#72C837', '#37C844', '#BBC837'],
  ['#B7487A', '#B2B748', '#48B785', '#4D48B7'],
  ['#0062FF', '#FF00E2', '#FF9D00', '#00FF1D'],
  ['#46B975', '#05FA1C', '#DFABC9', '#B946A2'],
  ['#8254AB', '#05B1FA', '#DFB7AB'],
  ['#C1AAD5', '#AB546F', '#00FF1E'],
  ['#1F07F8', '#AB9854', '#FFD400'],
  ['#40BFAD', '#9A8E65', '#FF0100'],
  ['#F10E83', '#484330', '#F1FF00'],
  ['#707C8F', '#C6C0A9', '#BDFF00'],
  ['#9D6286', '#FA7676', '#50AF80'],
  ['#515FAE', '#76E6FA', '#AF5091'],
  ['#2AD536', '#76FAC2', '#5052AF'],
  ['#679895', '#B10000', '#5052AF'],
  ['#98678D', '#FFACAC', '#EEE9D9'],
  ['#F98BE2', '#60EDFF', '#A5924C'],
  ['#065A58', '#FAFFAC', '#C4C4C4'],
  ['#BA7645', '#C4D100', '#FF8A93'],
  ['#0008A8', '#4FFF93', '#484F33'],
  ['#FFE1E0', '#D5C800', '#608200'],
  ['#424D78', '#B32392', '#C7FF27'],
  ['#ED9F12', '#DC7FC7', '#00A2AC'],
  ['#6E008D', '#51CA3E', '#CB8585'],
  ['#E50099', '#00E6DF', '#793333'],
  ['#005391', '#DC75DE', '#BFBA69'],
  ['#05FA39', '#6C1A6E', '#69BDBF', '#87D0FE'],
  ['#D16C2F', '#CFB6B9', '#ADF62B', '#1C7E70'],
  ['#BE4187', '#E29AEE', '#D0D0CF', '#65821C'],
  ['#686A97', '#979568'],
  ['#4D2AD5', '#B2D52A'],
  ['#A4D42B', '#2BD440', '#B9A4EC', '#8B7479', '#FD6A02', '#2BD48B', '#241154', '#AA5567'],
  ['#A2A35C', '#2BD4D3', '#4B23AD', '#AA5598', '#FCC903', '#669999', '#2BAD23', '#C3C68C'],
  ['#DB24D2', '#24DBDB', '#5E735D', '#F4FC56', '#E51A29', '#2481DB', '#212820', '#DBE171'],
  ['#20D7DF', '#B7B1FF'],
  ['#97688F', '#AB87A5'],
  ['#3DA3C2', '#63B6CF', '#215ADE', '#4D7BE5', '#9AA35C', '#AEB67C', '#AB5467', '#BC7685'],
  ['#717F8E', '#8D99A5', '#2B63D4', '#5582DD', '#D629B2', '#DE54C2', '#4758B8', '#6C79C6']
];

// --- SETUP (EXACTLY AS ORIGINAL) ---
function setup() {
  const backgroundIndex = Math.floor(rng.rand() * backgroundColours.length);
  const ForegroundIndex = Math.floor(rng.rand() * ForegroundColours.length);

  features.ForegroundColour = ForegroundColours[ForegroundIndex];
  features.backgroundColour = backgroundColours[backgroundIndex];
  features.widthdivision = Math.floor(rng.rand() * 100) + 100;
  features.heightdivision = Math.floor(rng.rand() * 100) + 100;
  features.numOfIt = Math.floor(rng.rand() * 10000) + 500;
}

// --- RULES (EXACTLY AS ORIGINAL) ---
function rules(a, b, c, d, e, f, g, h, i) {
  if (e == 1 && a + b + c + d + f + g + h + i < 2) return 0;
  else if (e == 1 && a + b + c + d + f + g + h + i == 2) return 1;
  else if (e == 1 && a + b + c + d + f + g + h + i == 3) return 1;
  else if (e == 1 && a + b + c + d + f + g + h + i > 3) return 0;
  else if (e == 0 && a + b + c + d + f + g + h + i == 3) return 1;
  else return 0;
}

// --- GENERATE RANDOM MATRIX (EXACTLY AS ORIGINAL) ---
function generateRandomMatrix(rows, cols, R) {
  const matrix = [];
  for (let i = 0; i < rows; i++) {
    matrix[i] = [];
    for (let j = 0; j < cols; j++) {
      matrix[i][j] = rng.rand() < R ? 0 : 1;
    }
  }
  return matrix;
}

// --- MAIN DRAW (EXACTLY AS ORIGINAL) ---
function drawCanvas() {
  window.cancelAnimationFrame(nextFrame);

  const canvas = document.getElementById('target');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = features.backgroundColour;
  ctx.fillRect(0, 0, w, h);

  // EXACTLY as original - using A1, A2, R, cells, cells1
  let A1 = features.widthdivision;
  let A2 = features.heightdivision;
  let R = rng.rand() * 0.5 + 0.4;
  let cells = generateRandomMatrix(A2, A1, R);
  let cells1 = cells;  // Original: cells1 = cells

  // Original loop exactly
  for (let p = 0; p <= features.numOfIt; p++) {
    for (let i = 1; i <= A1 - 2; i++) {
      for (let j = 1; j <= A2 - 2; j++) {
        let a = cells[j - 1][i - 1];
        let b = cells[j - 1][i];
        let c = cells[j - 1][i + 1];
        let d = cells[j][i - 1];
        let e = cells[j][i];
        let f = cells[j][i + 1];
        let g = cells[j + 1][i - 1];
        let h1 = cells[j + 1][i];
        let i1 = cells[j + 1][i + 1];
        cells1[j][i] = rules(a, b, c, d, e, f, g, h1, i1);
      }
    }
    cells = cells1;  // Original: cells=cells1
  }

  // Drawing - EXACTLY as original
  for (let i = 0; i <= A1 - 1; i++) {
    for (let j = 0; j <= A2 - 1; j++) {
      let x = i * w / A1;
      let y = j * h / A2;
      if (cells[j][i] == 1) {
        let Q = features.ForegroundColour[Math.floor(rng.rand() * features.ForegroundColour.length)];
        ctx.fillStyle = Q;
        ctx.fillRect(x, y, w / A1, h / A2);
      }
    }
  }

  if ('forceDownload' in urlParams && forceDownloaded === false) {
    forceDownloaded = true;
    autoDownloadCanvas();
    if (window.parent) {
      window.parent.postMessage('forceDownloaded', '*');
    }
  }

  if (animated) {
    nextFrame = window.requestAnimationFrame(drawCanvas);
  }

  updateUI();
}

// --- UPDATE UI ---
function updateUI() {
  document.getElementById('seedDisplay').textContent = String(seed).slice(0, 8);
  document.getElementById('gridDisplay').textContent = features.widthdivision + '×' + features.heightdivision;
  document.getElementById('cellsDisplay').textContent = features.widthdivision * features.heightdivision;
  document.getElementById('iterDisplay').textContent = features.numOfIt;
}

// --- REGENERATE ---
function regenerate() {
  seed = Date.now() + Math.random() * 1000000;
  rng = new RandomGenerator(seed);
  thumbnailTaken = false;
  
  setup();
  
  if (showingShirt) {
    toggleShirt();
  }
  
  layoutCanvas();
}

// --- TOGGLE SHIRT ---
function toggleShirt() {
  showingShirt = !showingShirt;
  const canvas = document.getElementById('target');
  const shirtMockup = document.getElementById('shirt-mockup');
  const shirtToggle = document.getElementById('shirtToggle');
  
  if (showingShirt) {
    canvas.classList.add('hidden');
    shirtMockup.classList.add('active');
    shirtToggle.classList.add('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
  } else {
    canvas.classList.remove('hidden');
    shirtMockup.classList.remove('active');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
  }
}

// --- DOWNLOAD ---
function autoDownloadCanvas() {
  const canvas = document.getElementById('target');
  const link = document.createElement('a');
  
  const seedStr = String(seed).slice(0, 8);
  link.download = prefix + '_Seed' + seedStr + '.png';
  
  if (showingShirt) {
    link.href = document.getElementById('shirt-mockup').src;
  } else {
    link.href = canvas.toDataURL('image/png', 1.0);
  }
  link.click();
}

// --- LAYOUT CANVAS ---
function layoutCanvas() {
  window.cancelAnimationFrame(nextFrame);
  
  const container = document.getElementById('canvas-container');
  const containerRect = container.getBoundingClientRect();
  let maxWidth = containerRect.width;
  let maxHeight = containerRect.height;
  
  maxWidth = Math.max(maxWidth, 80);
  maxHeight = Math.max(maxHeight, 80);
  
  let cWidth = maxWidth;
  let cHeight = cWidth / ratio;
  
  if (cHeight > maxHeight) {
    cHeight = maxHeight;
    cWidth = maxHeight * ratio;
  }
  
  cWidth = Math.max(cWidth, 80);
  cHeight = Math.max(cHeight, 80);
  
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  let targetWidth = cWidth * dpr;
  let targetHeight = cHeight * dpr;
  
  if ('forceWidth' in urlParams) {
    targetWidth = parseInt(urlParams.forceWidth);
    targetHeight = Math.floor(targetWidth / ratio);
    dpr = 1;
  }
  
  const canvas = document.getElementById('target');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  canvas.style.width = cWidth + 'px';
  canvas.style.height = cHeight + 'px';
  
  const shirtMockup = document.getElementById('shirt-mockup');
  shirtMockup.style.width = cWidth + 'px';
  shirtMockup.style.height = cHeight + 'px';
  
  drawCanvas();
}

// --- RESIZE ---
function handleResize() {
  clearTimeout(resizeTmr);
  resizeTmr = setTimeout(() => {
    layoutCanvas();
  }, 100);
}

// --- KEYBOARD ---
document.addEventListener('keydown', function(e) {
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    autoDownloadCanvas();
  }
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    regenerate();
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    toggleShirt();
  }
});

// --- CONTROLS ---
document.getElementById('controlsBar').addEventListener('click', regenerate);
document.getElementById('controlsBar').addEventListener('touchend', function(e) {
  e.preventDefault();
  regenerate();
});

document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
  e.preventDefault();
  toggleShirt();
});

// --- WINDOW ---
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', function() {
  setTimeout(handleResize, 400);
});

// --- VISIBILITY ---
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    setTimeout(() => {
      if (!showingShirt) {
        drawCanvas();
      }
    }, 100);
  }
});

// --- INIT ---
function init() {
  setup();
  layoutCanvas();
  updateUI();
  
  console.log('Maze of Life — Pure JS T-Shirt Edition');
  console.log('◷ Press T to toggle apparel view');
  console.log('Press S to save');
  console.log('Press R to regenerate');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

// Expose functions globally
window.regenerate = regenerate;
window.autoDownloadCanvas = autoDownloadCanvas;
window.toggleShirt = toggleShirt;
window.drawCanvas = drawCanvas;
window.layoutCanvas = layoutCanvas;
</script>
</body>
</html>
